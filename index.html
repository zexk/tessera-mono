<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera Mono — specimen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ─── tokens (overridden by JS) ──────────────────────────────────────── */
  :root {
    --bg: #0b0b0b;
    --panel: #161616;
    --ink: #ededed;
    --muted: #6e6e6e;
    --rule: #2a2a2a;
    --accent: #f5f5f5;
    --ui-font: ui-sans-serif, -apple-system, "Helvetica Neue", system-ui, sans-serif;
    --mono-font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ui-font); font-size: 14px; line-height: 1.5;
    transition: background 240ms ease, color 240ms ease;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  button { font-family: inherit; cursor: pointer; }

  .app { max-width: 1280px; margin: 0 auto; padding: 56px 48px 96px; }

  /* ─── Hero ───────────────────────────────────────────────────────────── */
  .hero { display: flex; flex-direction: column; gap: 48px;
    padding-bottom: 56px; border-bottom: 1px solid var(--rule); margin-bottom: 56px;
  }
  .hero-top { display: flex; align-items: flex-start; }
  .hero-mark { display: flex; gap: 24px; align-items: stretch; }
  .mark-square {
    border: 1.5px solid var(--ink); padding: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-meta { display: grid; grid-template-columns: auto 1fr;
    column-gap: 28px; row-gap: 4px; align-content: center;
    font-family: var(--mono-font); font-size: 11px;
  }
  .hero-meta-row { display: contents; }
  .hero-meta-row > span { color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
  .hero-meta-row > b { font-weight: 600; color: var(--ink); }

  .hero-display { padding: 8px 0; }
  .hero-display canvas { max-width: 100%; }

  .hero-bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: end; }
  .hero-tagline { margin: 0; font-size: 17px; line-height: 1.5; max-width: 540px;
    color: var(--ink); text-wrap: pretty;
  }
  .hero-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .hero-stats > div { display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid var(--rule); padding-top: 8px;
  }
  .hero-stats b { font-size: 18px; font-weight: 600; font-feature-settings: 'tnum'; }
  .hero-stats span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  /* ─── Section chrome ─────────────────────────────────────────────────── */
  .section { padding: 40px 0; border-top: 1px solid var(--rule); }
  .section:first-of-type { border-top: none; padding-top: 0; }
  .section-hd { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px;
    align-items: baseline; margin-bottom: 28px;
  }
  .section-hd-l { display: flex; align-items: baseline; gap: 14px; }
  .section-num { font-family: var(--mono-font); font-size: 12px;
    letter-spacing: .04em; font-weight: 500;
  }
  .section-title { margin: 0; font-size: 28px; font-weight: 500;
    letter-spacing: -0.01em; line-height: 1.1;
  }
  .section-sub { margin: 0; color: var(--muted); font-size: 14px;
    line-height: 1.55; text-wrap: pretty; max-width: 640px;
  }
  .section-body { display: flex; flex-direction: column; gap: 32px; }

  /* ─── Specimen ───────────────────────────────────────────────────────── */
  .specimen-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px;
    align-items: start;
  }
  .specimen-pane { border: 1px solid var(--rule); padding: 24px; overflow: auto; }
  .specimen-pane canvas { max-width: 100%; }
  .specimen-controls { display: flex; flex-direction: column; gap: 18px; }
  .ctrl { display: flex; flex-direction: column; gap: 8px; font-size: 12px;
    color: var(--muted); font-family: var(--mono-font);
  }
  .ctrl b { color: var(--ink); font-weight: 600; }
  .ctrl textarea { font-family: var(--mono-font); font-size: 12px; line-height: 1.5;
    border: 1px solid var(--rule); padding: 10px 12px;
    background: var(--panel); color: var(--ink); resize: vertical;
    outline: none;
  }
  .ctrl textarea:focus { border-color: var(--accent); }
  .ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctrl-foot { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono-font); font-size: 11px; padding: 4px 8px;
    border: 1px solid var(--rule); background: transparent;
    color: var(--ink); transition: background 120ms;
  }
  .chip:hover { border-color: var(--ink); }
  .chip-on { border-color: var(--ink) !important; }

  /* ─── Atlas ──────────────────────────────────────────────────────────── */
  .atlas-group { display: flex; flex-direction: column; gap: 12px; }
  .atlas-group-hd { display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--rule); padding-bottom: 8px;
  }
  .atlas-group-title { font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase;
  }
  .atlas-group-count { font-family: var(--mono-font); font-size: 10px; color: var(--muted); }
  .atlas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 14px;
  }
  .glyph-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .glyph-canvas { border: 1px solid var(--rule); }
  .glyph-meta { display: flex; justify-content: space-between; width: 100%;
    font-family: var(--mono-font); font-size: 9px; color: var(--muted);
  }
  .glyph-char { color: var(--ink); }

  /* ─── Box / math panels ──────────────────────────────────────────────── */
  .box-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  @media (max-width: 980px) { .box-grid { grid-template-columns: 1fr; } }
  .box-panel { border: 1px solid var(--rule); padding: 20px;
    display: flex; flex-direction: column; gap: 12px; overflow: auto;
  }
  .box-panel canvas { max-width: 100%; }
  .box-panel-label { font-family: var(--mono-font); font-size: 10px;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .math-stack { border: 1px solid var(--rule); padding: 24px;
    display: flex; flex-direction: column; gap: 14px; overflow: auto;
  }

  /* ─── Nerd coverage ──────────────────────────────────────────────────── */
  .cov-summary { display: grid; grid-template-columns: auto 1fr auto;
    gap: 20px; align-items: center; padding: 16px 20px; border: 1px solid var(--rule);
  }
  .cov-summary-l { display: flex; align-items: baseline; gap: 8px; }
  .cov-num { font-family: var(--mono-font); font-size: 22px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cov-of { font-family: var(--mono-font); font-size: 11px; color: var(--muted); }
  .cov-bar { height: 4px; background: var(--rule); position: relative; overflow: hidden; }
  .cov-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 2px; }
  .cov-summary-r { font-family: var(--mono-font); font-size: 11px; }

  .phase { display: flex; flex-direction: column; gap: 14px; }
  .phase-hd { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
  .phase-pill { font-family: var(--mono-font); font-size: 10px; padding: 2px 8px;
    letter-spacing: .04em; font-weight: 600;
  }
  .phase-title { font-weight: 500; font-size: 14px; }
  .phase-count { font-family: var(--mono-font); font-size: 11px; }

  .cov-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .cov-card { border: 1px solid var(--rule); padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cov-card-hd { display: flex; justify-content: space-between; align-items: baseline; }
  .cov-card-name { font-weight: 500; font-size: 13px; }
  .cov-card-count { font-family: var(--mono-font); font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .cov-card-range { font-family: var(--mono-font); font-size: 10px; }
  .cov-card-bar { height: 3px; background: var(--rule); position: relative; overflow: hidden; }
  .cov-card-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 0; }
  .cov-card-status { font-family: var(--mono-font); font-size: 10px;
    text-transform: uppercase; letter-spacing: .04em;
  }

  /* ─── Specs ──────────────────────────────────────────────────────────── */
  .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 980px) { .specs-grid { grid-template-columns: 1fr; } }
  .spec-card { border: 1px solid var(--rule); padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .spec-card h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .spec-card p { margin: 0; font-size: 13px; line-height: 1.55; }
  .spec-card canvas { max-width: 100%; }
  .spec-dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px;
    margin: 0; font-family: var(--mono-font); font-size: 11px;
    padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .spec-dl dt { color: var(--muted); }
  .spec-dl dd { margin: 0; }
  .spec-list { margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--mono-font); font-size: 11.5px; line-height: 1.5;
  }
  .spec-list li { display: flex; justify-content: space-between; gap: 12px;
    padding: 4px 0; border-bottom: 1px solid var(--rule);
  }
  .spec-list li:last-child { border-bottom: none; }
  .spec-list b { color: var(--accent); font-weight: 500; }

  .axes-grid { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 6px;
    align-items: stretch;
  }
  .axes-hd, .axes-col-hd, .axes-row-hd { font-family: var(--mono-font); font-size: 10px;
    padding: 6px 4px; display: flex; align-items: center; justify-content: center;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .axes-row-hd { justify-content: flex-end; }
  .axes-cell { border: 1px solid var(--rule); padding: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; min-height: 60px;
    transition: border-color 120ms;
  }
  .axes-cell:hover { border-color: var(--ink); }
  .axes-cell-on { border-width: 2px; padding: 9px; }

  /* ─── Ligatures ──────────────────────────────────────────────────────── */
  .lig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .lig-row { border: 1px solid var(--rule); padding: 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 12px;
  }
  .lig-from, .lig-to { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .lig-from span, .lig-to span { font-family: var(--mono-font); font-size: 9px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }
  .lig-arrow { font-family: var(--mono-font); font-size: 16px; transition: color 200ms; }

  .alts { border: 1px solid var(--rule); padding: 18px; margin-top: 8px; }
  .alts-hd { display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono-font); font-size: 10px; text-transform: uppercase;
    letter-spacing: .04em; padding-bottom: 12px; border-bottom: 1px solid var(--rule);
    margin-bottom: 14px;
  }
  .alts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .alts-pair { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .alts-pair span { font-family: var(--mono-font); font-size: 10px; color: var(--muted);
    text-align: center;
  }

  /* ─── Footer ─────────────────────────────────────────────────────────── */
  .footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono-font); font-size: 11px;
  }

  .text-run-canvas { display: block; }

  /* responsive */
  @media (max-width: 880px) {
    .app { padding: 32px 24px 64px; }
    .specimen-grid, .hero-bottom { grid-template-columns: 1fr; }
    .section-hd { grid-template-columns: 1fr; gap: 8px; }
    .hero-stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ─── Tighter spacing ────────────────────────────────────────────────── */
  .app { padding: 0 48px 80px; }
  .section { padding: 24px 0; }
  .section-body { gap: 18px; }
  .hero { gap: 20px; padding-bottom: 28px; margin-bottom: 28px; }
  .hero-bottom { gap: 28px; }

  /* ─── Section nav ────────────────────────────────────────────────────── */
  .section-nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; overflow-x: auto; gap: 0;
    background: var(--bg); border-bottom: 1px solid var(--rule);
    padding: 0; margin: 0 -48px 36px; padding: 0 48px;
    scrollbar-width: none;
  }
  .section-nav::-webkit-scrollbar { display: none; }
  .section-nav a {
    font-family: var(--mono-font); font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; white-space: nowrap;
    padding: 10px 14px; text-decoration: none; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 120ms;
  }
  .section-nav a:hover { color: var(--ink); }

  /* ─── Tab bar ────────────────────────────────────────────────────────── */
  .tab-bar {
    display: flex; overflow-x: auto; gap: 0;
    border-bottom: 1px solid var(--rule); margin-bottom: 18px;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    font-family: var(--mono-font); font-size: 11px; letter-spacing: .03em;
    white-space: nowrap; padding: 7px 14px; background: transparent;
    border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--muted); cursor: pointer; transition: color 120ms;
  }
  .tab:hover { color: var(--ink); }
  .tab-on { color: var(--ink) !important; border-bottom-color: var(--ink) !important; }

  /* ─── Horizontal card scroll ─────────────────────────────────────────── */
  .h-card-row {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px;
    scrollbar-width: thin;
  }
  .h-card-row .cov-card { flex: none; width: 220px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="src/glyphs.js"></script>
  <script src="src/icons.js"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/renderer.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
